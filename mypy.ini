# mypy configuration.
#
# Type checking is part of the reproducibility contract: a schema that silently
# drifts its types would let invalid records through. Settings are pinned here so
# `python -m mypy .` gives the same result on any machine.
#
# Verify with:  python -m mypy .

[mypy]
python_version = 3.13
files = ml, datasets, experiments, scripts, backend
exclude = (?x)(^\.venv/|^node_modules/|/__pycache__/|\.mypy_cache/)

# Third-party stubs are incomplete or absent for the optional heavy stacks, which
# are deliberately not installed yet.
ignore_missing_imports = True

# Report the strictest useful level without demanding annotations on test
# fixtures and local closures.
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True

# warn_unreachable and redundant-expr are intentionally OFF. The schema layer
# re-validates field types at runtime because it parses untrusted JSON/YAML, which
# mypy's declaration-based view treats as already well-typed. Those checks would
# flag every such guard as dead code and tempt someone into deleting it.

# Enum members are keyed by their string value throughout the manifests and
# configs; these error codes catch conditions that would hide a bad lookup.
enable_error_code = ignore-without-code,truthy-bool

[mypy-tests.*]
# Tests build payloads dynamically and assert on raw mappings.
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-scripts.*]
# Scripts are CLI wrappers.
disallow_untyped_defs = False

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True